<!-- templates/login_modal.html -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content border-0 shadow" style="background-color: var(--bg-surface); border-radius: 12px;">
            <div class="modal-body p-4">
                
                <!-- Header Modal -->
                <div class="text-center mb-4">
                    <h5 class="fw-bold mb-1" style="color: var(--text-main);">Sign In</h5>
                    <p class="text-muted small mb-0">Enter your credentials to access the system</p>
                </div>

                <!-- Notifikasi Error Profesional (Soft Minimalist Banner) -->
                <div id="loginErrorContainer" class="d-none mb-3 py-2 px-3 rounded-2 text-danger small fw-medium" role="alert" style="font-size: 0.8rem; background-color: rgba(220, 53, 69, 0.08); border: 1px solid rgba(220, 53, 69, 0.2);"></div>

                <form id="loginForm">
                    <!-- Username -->
                    <div class="mb-3">
                        <label for="loginUsername" class="form-label small fw-semibold text-muted mb-1">Username or Email</label>
                        <input type="text" class="form-control bg-light border-0 py-2" id="loginUsername" name="username" placeholder="name@company.com" required style="border-radius: 6px; font-size: 0.9rem;">
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-4">
                        <label for="loginPassword" class="form-label small fw-semibold text-muted mb-1">Password</label>
                        <input type="password" class="form-control bg-light border-0 py-2" id="loginPassword" name="password" placeholder="••••••••" required style="border-radius: 6px; font-size: 0.9rem;">
                    </div>

                    <!-- Action Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold" id="loginBtn" style="border-radius: 6px; font-size: 0.9rem;">
                            Continue
                        </button>
                    </div>
                </form>

                <!-- Footer text -->
                <div class="text-center mt-3">
                    <p class="text-muted" style="font-size: 0.7rem;">Protected by enterprise authentication</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript AJAX -->
<script>
    (function() {
        const loginForm = document.getElementById('loginForm');
        const errorContainer = document.getElementById('loginErrorContainer');
        const loginBtn = document.getElementById('loginBtn');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                loginBtn.disabled = true;
                loginBtn.textContent = 'Authenticating...';
                errorContainer.classList.add('d-none');
                errorContainer.textContent = '';

                const formData = new FormData(loginForm);
                
                try {
                    const response = await fetch("{{ url_for('main.login') }}", {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (response.ok) {
                        window.location.reload();
                    } else {
                        // Tampilkan pesan error dengan transisi bersih
                        errorContainer.textContent = result.message;
                        errorContainer.classList.remove('d-none');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Continue';
                    }
                } catch (error) {
                    errorContainer.textContent = "System unavailable. Please try again later.";
                    errorContainer.classList.remove('d-none');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Continue';
                }
            });
        }
    })();
</script>
