<!-- templates/login_modal.html -->

<!-- Bootstrap Modal wrapper — max-width 400px, centered -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content border-0" style="
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 48px -8px rgba(15,23,42,.14), 0 8px 16px -4px rgba(15,23,42,.08);
            overflow: hidden;
        ">

            <!-- ── Inline styles scoped to this modal ── -->
            <style>
                /* ─ Tokens ─ */
                #loginModal {
                    --em7:   #0F766E;
                    --em6:   #0D9488;
                    --em5:   #14B8A6;
                    --em50:  #F0FDFA;
                    --em100: #CCFBF1;
                    --em200: #99F6E4;
                    --slate900: #0F172A;
                    --slate600: #475569;
                    --slate400: #94A3B8;
                    --slate200: #E2E8F0;
                    --slate100: #F1F5F9;
                    --slate50:  #F8FAFC;
                    --red:   #DC2626;
                    --red-bg: rgba(220,38,38,.07);
                    --red-border: rgba(220,38,38,.18);
                    --font: 'Inter', system-ui, sans-serif;
                    --mono: 'JetBrains Mono', ui-monospace, monospace;
                }

                /* ─ Field label ─ */
                #loginModal .lm-label {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    font-size: 10px;
                    font-weight: 700;
                    letter-spacing: .07em;
                    text-transform: uppercase;
                    color: var(--slate600);
                    margin-bottom: 6px;
                    font-family: var(--font);
                }
                #loginModal .lm-label a {
                    font-size: 11px;
                    font-weight: 600;
                    letter-spacing: .01em;
                    text-transform: none;
                    color: var(--em6);
                    text-decoration: none;
                }
                #loginModal .lm-label a:hover { text-decoration: underline; }

                /* ─ Input wrapper ─ */
                #loginModal .lm-input-wrap {
                    position: relative;
                    display: flex;
                    align-items: center;
                }
                #loginModal .lm-input-icon {
                    position: absolute;
                    left: 12px;
                    color: var(--slate400);
                    pointer-events: none;
                    line-height: 0;
                    flex-shrink: 0;
                }
                #loginModal .lm-input {
                    width: 100%;
                    height: 42px;
                    background: var(--slate50);
                    border: 1.5px solid var(--slate200);
                    border-radius: 10px;
                    padding: 0 40px 0 38px;
                    font-size: 13px;
                    font-family: var(--font);
                    color: var(--slate900);
                    outline: none;
                    transition: border-color .15s, box-shadow .15s, background .15s;
                }
                #loginModal .lm-input::placeholder { color: var(--slate400); }
                #loginModal .lm-input:focus {
                    background: #fff;
                    border-color: var(--em7);
                    box-shadow: 0 0 0 3px rgba(15,118,110,.12);
                }

                /* ─ Toggle eye button ─ */
                #loginModal .lm-eye {
                    position: absolute;
                    right: 11px;
                    background: none;
                    border: none;
                    padding: 4px;
                    cursor: pointer;
                    color: var(--slate400);
                    line-height: 0;
                    border-radius: 6px;
                    transition: color .15s, background .15s;
                }
                #loginModal .lm-eye:hover { color: var(--slate600); background: var(--slate100); }

                /* ─ Custom checkbox ─ */
                #loginModal .lm-check-wrap {
                    display: flex;
                    align-items: center;
                    gap: 9px;
                    cursor: pointer;
                    user-select: none;
                }
                #loginModal .lm-check-wrap input[type="checkbox"] { display: none; }
                #loginModal .lm-check-box {
                    width: 18px;
                    height: 18px;
                    border-radius: 5px;
                    border: 1.5px solid var(--slate200);
                    background: #fff;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-shrink: 0;
                    transition: background .15s, border-color .15s;
                }
                #loginModal .lm-check-wrap input:checked ~ .lm-check-box {
                    background: var(--em7);
                    border-color: var(--em7);
                }
                #loginModal .lm-check-box svg { opacity: 0; transition: opacity .12s; }
                #loginModal .lm-check-wrap input:checked ~ .lm-check-box svg { opacity: 1; }
                #loginModal .lm-check-label {
                    font-size: 13px;
                    font-weight: 500;
                    color: var(--slate600);
                    font-family: var(--font);
                }

                /* ─ Continue button ─ */
                #loginModal .lm-btn {
                    width: 100%;
                    height: 46px;
                    background: var(--em7);
                    color: #fff;
                    border: none;
                    border-radius: 12px;
                    font-size: 14px;
                    font-weight: 700;
                    font-family: var(--font);
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                    transition: background .15s, box-shadow .15s, transform .1s;
                    box-shadow: 0 4px 12px -2px rgba(15,118,110,.35);
                    letter-spacing: -.01em;
                }
                #loginModal .lm-btn:hover { background: var(--em6); box-shadow: 0 6px 16px -3px rgba(15,118,110,.4); }
                #loginModal .lm-btn:active { background: #115E59; transform: translateY(1px); }
                #loginModal .lm-btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }

                /* ─ Error banner ─ */
                #loginModal .lm-error {
                    display: none;
                    align-items: center;
                    gap: 8px;
                    padding: 10px 13px;
                    border-radius: 9px;
                    background: var(--red-bg);
                    border: 1px solid var(--red-border);
                    color: var(--red);
                    font-size: 12px;
                    font-weight: 600;
                    font-family: var(--font);
                    margin-bottom: 16px;
                }
                #loginModal .lm-error.show { display: flex; }

                /* ─ Footer shield ─ */
                #loginModal .lm-footer {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 6px;
                    color: var(--em6);
                    font-size: 11px;
                    font-weight: 500;
                    font-family: var(--font);
                    margin-top: 18px;
                }

                /* ─ Divider line below footer icon ─ */
                #loginModal .lm-dot {
                    width: 4px;
                    height: 4px;
                    border-radius: 50%;
                    background: var(--slate200);
                    margin: 10px auto 0;
                }
            </style>

            <div class="modal-body" style="padding: 32px 28px 24px;">

                <!-- ── Logo / Brand Icon ── -->
                <div style="display:flex;justify-content:center;margin-bottom:20px;">
                    <!-- Outer soft ring -->
                    <div style="
                        width: 64px; height: 64px;
                        border-radius: 50%;
                        background: var(--em50);
                        display: flex; align-items: center; justify-content: center;
                        position: relative;
                    ">
                        <!-- Lock icon -->
                        <div style="
                            width: 46px; height: 46px;
                            border-radius: 50%;
                            background: linear-gradient(135deg, #0F766E 0%, #0D9488 100%);
                            display: flex; align-items: center; justify-content: center;
                            box-shadow: 0 4px 12px -2px rgba(15,118,110,.4);
                        ">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </div>
                        <!-- Green checkmark badge -->
                        <div style="
                            position: absolute;
                            bottom: 2px; right: 2px;
                            width: 20px; height: 20px;
                            border-radius: 50%;
                            background: #10B981;
                            border: 2px solid #ffffff;
                            display: flex; align-items: center; justify-content: center;
                        ">
                            <svg width="10" height="10" viewBox="0 0 20 20" fill="#ffffff">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- ── Title ── -->
                <div style="text-align:center; margin-bottom:24px;">
                    <h5 style="
                        font-family: 'Inter', sans-serif;
                        font-size: 20px;
                        font-weight: 700;
                        color: #0F172A;
                        margin: 0 0 5px;
                        letter-spacing: -.02em;
                    ">{{ _('Masuk') }}</h5>
                    <p style="
                        font-family: 'Inter', sans-serif;
                        font-size: 13px;
                        color: #0D9488;
                        margin: 0;
                        font-weight: 400;
                    ">{{ _('Masukkan kredensial Anda untuk mengakses sistem') }}</p>
                </div>

                <!-- ── Error Banner ── -->
                <div class="lm-error" id="loginErrorContainer" role="alert">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span id="loginErrorText"></span>
                </div>

                <!-- ── Form ── -->
                <form id="loginForm" autocomplete="on" style="display:flex;flex-direction:column;gap:16px;">

                    <!-- Username / Email -->
                    <div>
                        <div class="lm-label">
                            <span>{{ _('Nama Pengguna atau Email') }}</span>
                        </div>
                        <div class="lm-input-wrap">
                            <span class="lm-input-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </span>
                            <input
                                class="lm-input"
                                type="text"
                                id="loginUsername"
                                name="username"
                                placeholder="{{ _('nama@perusahaan.com') }}"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <div class="lm-label">
                            <span>{{ _('Kata Sandi') }}</span>
                            <a href="#">{{ _('Lupa kata sandi?') }}</a>
                        </div>
                        <div class="lm-input-wrap">
                            <span class="lm-input-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                            </span>
                            <input
                                class="lm-input"
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="••••••••••••"
                                autocomplete="current-password"
                                required
                            >
                            <button class="lm-eye" type="button" id="togglePwd" aria-label="Toggle password visibility">
                                <!-- Eye icon (show) -->
                                <svg id="eyeShow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <!-- Eye-off icon (hide) — shown when password is visible -->
                                <svg id="eyeHide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember this workstation -->
                    <div>
                        <label class="lm-check-wrap">
                            <input type="checkbox" id="rememberMe" name="remember_me">
                            <span class="lm-check-box">
                                <svg width="10" height="10" viewBox="0 0 20 20" fill="#ffffff">
                                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                </svg>
                            </span>
                            <span class="lm-check-label">{{ _('Ingat perangkat ini') }}</span>
                        </label>
                    </div>

                    <!-- Continue Button -->
                    <div style="margin-top:4px;">
                        <button type="submit" class="lm-btn" id="loginBtn">
                            <span id="loginBtnText">{{ _('Lanjutkan') }}</span>
                            <svg id="loginBtnArrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            <!-- Spinner (hidden by default) -->
                            <svg id="loginBtnSpinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:none;animation:lm-spin .75s linear infinite;">
                                <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-opacity=".25"/>
                                <path d="M21 12a9 9 0 00-9-9" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>

                </form>

                <!-- ── Footer ── -->
                <div class="lm-footer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span>{{ _('Dilindungi oleh autentikasi perusahaan') }}</span>
                </div>
                <div class="lm-dot"></div>

            </div><!-- /modal-body -->
        </div><!-- /modal-content -->
    </div>
</div>

<!-- ── Keyframes for spinner ── -->
<style>
@keyframes lm-spin {
    to { transform: rotate(360deg); }
}
</style>

<!-- ── AJAX Script ── -->
<script>
(function () {
    const form       = document.getElementById('loginForm');
    const errorEl    = document.getElementById('loginErrorContainer');
    const errorText  = document.getElementById('loginErrorText');
    const btn        = document.getElementById('loginBtn');
    const btnText    = document.getElementById('loginBtnText');
    const btnArrow   = document.getElementById('loginBtnArrow');
    const btnSpinner = document.getElementById('loginBtnSpinner');
    const pwdInput   = document.getElementById('loginPassword');
    const toggleBtn  = document.getElementById('togglePwd');
    const eyeShow    = document.getElementById('eyeShow');
    const eyeHide    = document.getElementById('eyeHide');

    /* ── Toggle password visibility ── */
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
            const isText = pwdInput.type === 'text';
            pwdInput.type = isText ? 'password' : 'text';
            eyeShow.style.display = isText ? '' : 'none';
            eyeHide.style.display = isText ? 'none' : '';
        });
    }

    /* ── Helpers ── */
    function setLoading(on) {
        btn.disabled   = on;
        btnText.textContent = on ? '{{ _("Sedang Mengautentikasi...") }}' : '{{ _("Lanjutkan") }}';
        btnArrow.style.display   = on ? 'none' : '';
        btnSpinner.style.display = on ? '' : 'none';
    }

    function showError(msg) {
        errorText.textContent = msg;
        errorEl.classList.add('show');
    }

    function hideError() {
        errorEl.classList.remove('show');
        errorText.textContent = '';
    }

    /* ── Form submit ── */
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            setLoading(true);

            try {
                const res    = await fetch("{{ url_for('main.login') }}", {
                    method: 'POST',
                    body: new FormData(form)
                });
                const result = await res.json();

                if (res.ok) {
                    // Arahkan langsung ke halaman dashboard setelah sukses login
                    window.location.href = "{{ url_for('main.dashboard') }}";
                } else {
                    showError(result.message);
                    setLoading(false);
                }
            } catch (_) {
                showError("{{ _('Sistem tidak tersedia. Silakan coba lagi nanti.') }}");
                setLoading(false);
            }
        });
    }
})();
</script>
